name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Server tests
        run: npm run test:server

      - name: Frontend build
        run: npm run build
        env:
          CI: false
          REACT_APP_API_BASE_URL: http://localhost:2345
          REACT_APP_AUTH_API_BASE_URL: http://localhost:2345
          REACT_APP_RAZORPAY_KEY_ID: rzp_test_placeholder
