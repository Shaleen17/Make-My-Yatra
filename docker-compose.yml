services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/make-my-yatra
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      JOBS_ENABLED: "true"
    ports:
      - "2345:2345"
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
